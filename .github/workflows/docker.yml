name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Tested before pushing, so a broken image never becomes :latest and
      # never triggers a redeploy.
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: job-applications:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and check it serves
        run: sh scripts/smoke-test-image.sh job-applications:test

      # Reuses the layers just built via the cache.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: the webhook URL is a secret, so nothing about the target
      # host is in the repo. Skipped when the secret isn't set.
      # On failure it reports who refused the call: Cloudflare (challenge or
      # block page) or Portainer (JSON error). Headers and body don't contain
      # the URL, which Actions masks anyway.
      - name: Trigger Portainer redeploy
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: |
          status=$(curl -sS -X POST -o body.txt -D headers.txt -w '%{http_code}' "$PORTAINER_WEBHOOK_URL")
          if [ "$status" -lt 300 ]; then
            echo "Portainer redeploy triggered (HTTP $status)."
            exit 0
          fi

          echo "::error::Portainer webhook returned HTTP $status"
          grep -iE '^(server|cf-ray|cf-mitigated|content-type):' headers.txt || true
          # Behind Cloudflare every response says "server: cloudflare", so the
          # content type is what tells Portainer's JSON errors apart.
          if grep -qi '^cf-mitigated:' headers.txt; then
            echo "::error::Cloudflare challenged the request (Bot Fight Mode or Security Level). Check Security → Events for this path."
          elif grep -qi '^content-type: *application/json' headers.txt; then
            echo "::error::Portainer refused the request. Check that the stack's webhook is enabled and the secret holds its current URL."
          else
            echo "::error::Not a Portainer response: likely a Cloudflare block page or Cloudflare Access. Check Security → Events and Zero Trust → Access."
          fi
          echo "--- response body (first 500 bytes) ---"
          head -c 500 body.txt
          echo
          exit 1
